name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref — a force-push should not queue twice.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: check · lint · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The floor declared in package.json engines, and the current LTS.
        node: ['20', '22']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install
        run: npm ci

      # `lint` is an alias of `check` in this project — tsc under `strict` plus
      # `noUncheckedIndexedAccess`. Both are listed because the docs claim a
      # four-step chain and a reader should be able to see each step pass.
      - name: Typecheck
        run: npm run check

      - name: Lint
        run: npm run lint

      # Build BEFORE test, and this is load-bearing rather than stylistic: every
      # suite imports from `dist/`, and `check`/`lint` are `--noEmit`, so nothing
      # has produced it yet. On a developer machine `dist/` is already there from
      # a previous build and the ordering mistake stays invisible until CI.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      # The package `exports` map is a contract. A subpath pointing at a file that
      # tsc never emitted ships a broken deep import that nothing else would catch.
      - name: Verify every export target exists
        run: node scripts/check-exports.mjs

      - uses: actions/upload-artifact@v4
        if: matrix.node == '22'
        with:
          name: dist-node22
          path: dist/
          retention-days: 7
